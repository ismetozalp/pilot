<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pilot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/pilot.css">
    <script src="../base1/cockpit.js"></script>
</head>
<body>

<div class="pilot-shell" x-data="pilotApp()" x-init="init()" x-cloak>

    <div class="pilot-header d-flex align-items-center gap-3">
        <strong class="me-2">Pilot</strong>
        <ul class="nav nav-pills nav-sm flex-grow-1">
            <template x-for="t in tabs" :key="t.id">
                <li class="nav-item">
                    <button class="nav-link py-1 px-3"
                            :class="{ active: tab === t.id }"
                            @click="tab = t.id"
                            x-text="t.label"></button>
                </li>
            </template>
        </ul>
    </div>

    <div class="pilot-body">
        <!-- One mount per surface. Each surface reports its own failure into
             errors[<tab>]; there is deliberately no global error banner (spec §7.2). -->
        <div x-show="tab === 'overview'"    id="pilot-overview"></div>
        <div x-show="tab === 'setup'"       id="pilot-setup"></div>
        <div x-show="tab === 'devices'"     id="pilot-devices"></div>
        <div x-show="tab === 'addressbook'" id="pilot-addressbook"></div>
        <div x-show="tab === 'users'"       id="pilot-users"></div>
        <div x-show="tab === 'audit'"       id="pilot-audit"></div>
        <div x-show="tab === 'server-ops'"  id="pilot-server-ops"></div>
    </div>

    <!-- Modal partials are injected here by boot.js before Alpine starts. -->
    <div id="pilot-partials"></div>

</div>

<!-- Vendor. Fetched by `make vendor`, not committed. Alpine is NOT loaded here:
     js/boot.js loads it after injecting the partials, so Alpine walks a complete
     DOM. That is the whole boot trick, identical to hangar and manifest. -->
<script src="js/bootstrap.bundle.min.js"></script>

<!-- Core modules — C7 order, js/core/errors.js always first. A task that creates a
     core module inserts its tag immediately BEFORE the marker below, at the
     position C7 pins. tests/smoke.mjs rule 4 fails loudly on a C7 inversion. -->
<script src="js/core/errors.js"></script>
<!-- pilot:core-scripts -->

<!-- Feature modules — C7 order. Same rule: insert before the marker. -->
<!-- pilot:feature-scripts -->

<script src="js/app.js"></script>
<script src="js/boot.js"></script>

</body>
</html>
